name: Quick-ID CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 1) Backend Tests — pytest birim ve entegrasyon testleri
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: quick_id_test
      JWT_SECRET: test-secret-key-for-ci-only-do-not-use-in-prod
      QUICKID_SERVICE_KEY: test-service-key-for-ci-only-32-chars
      QUICKID_BOOTSTRAP_ADMIN_EMAIL: ci-admin@quickid.invalid
      QUICKID_BOOTSTRAP_ADMIN_PASSWORD: CI-Only-Strong-Password-2026!
      OPENAI_API_KEY: test-key
      BACKEND_PORT: "8001"

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Backend paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Backend'i arka planda başlat (port 8001)
        run: |
          cd backend
          nohup python server.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "Backend PID: $(cat /tmp/backend.pid)"

      - name: Backend hazır olana kadar bekle (max 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "✅ Backend hazır ($i. saniye)"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Backend 30 saniyede hazır olmadı. Log:"
          cat /tmp/backend.log
          exit 1

      - name: Pytest çalıştır
        run: |
          if [ -d backend/tests ]; then
            cd backend && python -m pytest tests/ -v
          else
            echo "backend/tests klasörü yok, test atlandı."
          fi

      - name: Backend log (test sonrası)
        if: always()
        run: |
          echo "=== Backend log ==="
          tail -100 /tmp/backend.log || true
          if [ -f /tmp/backend.pid ]; then kill $(cat /tmp/backend.pid) 2>/dev/null || true; fi

  # ============================================================
  # 2) Backend Lint & Syntax — python compileall
  # ============================================================
  backend-lint:
    name: Backend Lint & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax kontrolü
        run: python -m compileall -q backend

  # ============================================================
  # 3) Frontend Build — production build
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    env:
      CI: false
      DISABLE_ESLINT_PLUGIN: "true"
      VITE_BACKEND_URL: http://localhost:8000

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend paketlerini kur
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Production build al
        run: |
          cd frontend
          npm run build

  # ============================================================
  # 4) Frontend Lint — eslint
  # ============================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend paketlerini kur
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint çalıştır (yeni hata eklenmesini engelle)
        run: |
          cd frontend
          npm run lint

  # ============================================================
  # 5) Security Scan — npm audit + pip-audit
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pip-audit kur
        run: pip install pip-audit

      - name: Backend güvenlik taraması (pip-audit)
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt --desc --ignore-vuln GHSA-4xh5-x5gv-qwph
          fi

      - name: Frontend güvenlik taraması (npm audit)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  # ============================================================
  # 6) Quality Gate Summary — tüm job sonuçlarını topla
  # ============================================================
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-lint
      - frontend-build
      - frontend-lint
      - security-scan
    if: always()

    steps:
      - name: Sonuçları özetle
        run: |
          echo "## 🚦 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Kontrol | Durum |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint & Syntax | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Kritik job'ları doğrula
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Kritik kontrollerden biri başarısız oldu"
            exit 1
          fi
          echo "✅ Tüm kritik kontroller geçti"
