name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: test-secret
      OPENAI_API_KEY: test-key
      REACT_APP_BACKEND_URL: http://localhost:8000
      CI: false

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Python dosyalarını kontrol et
        run: |
          python -m compileall backend

      - name: Python testlerini çalıştır
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "tests klasörü yok, test atlandı."
          fi

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend paketlerini kur
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Frontend build al
        run: |
          cd frontend
          npm run build
